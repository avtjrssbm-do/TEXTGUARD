<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TextGuard</title>

<link rel="manifest" href="manifest.json">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2f5fb;
padding:15px;
}

.container{
max-width:600px;
margin:auto;
}

.card{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:20px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.title{
font-size:30px;
font-weight:bold;
margin-bottom:20px;
}

button{

width:100%;
padding:15px;
margin-top:10px;

border:none;
border-radius:12px;

background:#2962ff;
color:white;

font-size:16px;
font-weight:bold;

cursor:pointer;
}

input{

width:100%;
padding:12px;
margin-top:10px;

border-radius:10px;
border:1px solid #ddd;

}

.stats{

display:grid;
grid-template-columns:1fr 1fr;
gap:10px;

margin-top:15px;

}

.stat{

padding:15px;
border-radius:12px;
background:#fafafa;
text-align:center;

}

.big{

font-size:28px;
font-weight:bold;

}

.textBox{

margin-top:15px;

height:300px;
overflow:auto;

padding:15px;

background:#fafafa;

border-radius:10px;

line-height:1.7;

}

.error{

padding:10px;

margin-top:10px;

background:#fff2f2;

border-left:5px solid red;

border-radius:10px;

}

</style>

</head>

<body>

<div class="container">

<div class="title">

TextGuard

</div>


<div class="card">

<h3>База для сравнения</h3>

<input
type="file"
id="databaseFolder"
multiple
>

<button
onclick="uploadDatabase()"
>

Загрузить базу

</button>

<br><br>

<input
type="text"
id="dbLink"
placeholder="https://site.com/database.zip"
>

<button
onclick="loadDatabaseLink()"
>

Подключить базу по ссылке

</button>

</div>



<div class="card">

<h3>Проверяемый файл</h3>

<input
type="file"
id="file"
>

<button
onclick="checkFile()"
>

Проверить

</button>

</div>


<div id="result"></div>

</div>

<script src="script.js"></script>

</body>

</html>

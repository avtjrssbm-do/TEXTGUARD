<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TextGuard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2f5fb;
padding:15px;
}

.container{
max-width:500px;
margin:auto;
}

.header{
display:flex;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:26px;
font-weight:bold;
color:#111;
}

.card{
background:white;
border-radius:25px;
padding:20px;
margin-bottom:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.uploadCard{
text-align:center;
}

.uploadArea{
border:2px dashed #d8e2ff;
border-radius:25px;
padding:30px;
background:#fafcff;
margin-bottom:20px;
transition:.3s;
}

.uploadArea:hover{
border-color:#2962ff;
}

.uploadIcon{
font-size:60px;
color:#2962ff;
margin-bottom:15px;
}

.uploadArea h3{
margin-bottom:10px;
color:#222;
}

.uploadArea p{
color:#777;
margin:5px 0;
}

.formats{
font-size:13px;
color:#999;
}

.chooseBtn{
background:#2962ff;
width:220px;
margin:auto;
margin-top:15px;
}

.checkBtn{
background:#00C853;
margin-top:15px;
}

button{
padding:14px;
border:none;
border-radius:12px;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
width:100%;
transition:.3s;
}

button:active{
transform:scale(.98);
}

.fileName{
margin-top:15px;
padding:12px;
background:#f5f7ff;
border-radius:12px;
font-size:14px;
font-weight:bold;
color:#555;
border:1px solid #dce6ff;
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
padding:15px;
border-radius:15px;
background:white;
border:1px solid #eee;
}

.big{
font-size:28px;
font-weight:bold;
margin-bottom:5px;
}

.green{
color:#00C853;
}

.red{
color:#ff4444;
}

.orange{
color:#ff9800;
}

.blue{
color:#2962ff;
}

.textBox{
height:350px;
overflow-y:auto;
line-height:1.8;
padding:15px;
background:#fafafa;
border-radius:15px;
border:1px solid #ddd;
scroll-behavior:smooth;
}

.highlight{
background:#ffe84f;
padding:2px;
border-radius:4px;
transition:.5s;
}

.error{
padding:15px;
margin-top:10px;
background:#fff5f5;
border-radius:12px;
cursor:pointer;
border-left:5px solid red;
transition:.3s;
}

.error:hover{
transform:scale(1.02);
}

.progress{
display:none;
margin-top:10px;
height:10px;
background:#ddd;
border-radius:20px;
overflow:hidden;
}

.bar{
width:0%;
height:100%;
background:#2962ff;
transition:.3s;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<div class="title">
TextGuard
</div>

</div>

<div class="card uploadCard">

<div class="uploadArea">

<div class="uploadIcon">
☁
</div>

<h3>
Перетащите файл сюда
</h3>

<p>
или выберите файл
</p>

<p class="formats">
Поддерживаются: .txt .docx .pdf
</p>

<input
type="file"
id="file"
hidden
onchange="showFileName()"
>

<button
class="chooseBtn"
onclick="document.getElementById('file').click()"
>
Выбрать файл
</button>

<div
class="fileName"
id="selectedFile"
>
Файл не выбран
</div>

</div>

<button
class="checkBtn"
onclick="checkFile()"
>
Проверить текст
</button>

<div
class="progress"
id="progress"
>

<div
class="bar"
id="bar"
></div>

</div>

</div>

<div id="result"></div>

</div>

<script>

function showFileName(){

const file=
document.getElementById(
"file"
).files[0];

const label=
document.getElementById(
"selectedFile"
);

if(file){

label.innerHTML=
file.name;

}else{

label.innerHTML=
"Файл не выбран";

}

}


async function checkFile(){

const file=
document.getElementById(
"file"
).files[0];

if(!file){

alert(
"Выберите файл"
);

return;

}

const progress=
document.getElementById(
"progress"
);

const bar=
document.getElementById(
"bar"
);

progress.style.display=
"block";

let val=0;

let fake=
setInterval(()=>{

if(val<90){

val+=10;

bar.style.width=
val+"%";

}

},300);

const formData=
new FormData();

formData.append(
"file",
file
);

try{

const response=
await fetch(
"http://127.0.0.1:8000/check",
{
method:"POST",
body:formData
}
);

const data=
await response.json();

clearInterval(fake);

bar.style.width="100%";

let text=data.text;

data.errors.forEach((e,i)=>{

let safe=e.word.replace(
/[.*+?^${}()|[\]\\]/g,
'\\$&'
);

text=text.replace(

new RegExp(
safe,
"i"
),

`<span class="highlight" id="err${i}">${e.word}</span>`

);

});

let html=`

<div class="stats">

<div class="stat">
<div class="big green">${data.uniqueness}%</div>
Уникальность
</div>

<div class="stat">
<div class="big red">${data.plagiarism}%</div>
Плагиат
</div>

<div class="stat">
<div class="big orange">${data.errors_count}</div>
Ошибки
</div>

<div class="stat">
<div class="big blue">${data.time}</div>
сек
</div>

</div>

<div class="card">

<h3>Текст документа</h3>

<br>

<div class="textBox">

${text}

</div>

</div>

`;

if(data.errors.length){

html+=`<div class="card">

<h3>Ошибки</h3>`;

data.errors.forEach((e,i)=>{

html+=`

<div
class="error"
onclick="jumpToError(${i})"
>

<b>${e.word}</b>

<br><br>

${e.message}

<br><br>

${e.replacements.join(", ")}

</div>

`;

});

html+=`</div>`;

}

document.getElementById(
"result"
).innerHTML=
html;

setTimeout(()=>{

progress.style.display=
"none";

bar.style.width=
"0%";

},1000);

}

catch{

alert(
"Ошибка подключения к FastAPI"
);

}

}


function jumpToError(index){

const element=
document.getElementById(
"err"+index
);

if(!element)
return;

element.scrollIntoView({

behavior:"smooth",
block:"center"

});

element.style.background=
"#ff9800";

setTimeout(()=>{

element.style.background=
"#ffe84f";

},1500);

}

</script>

</body>

</html>

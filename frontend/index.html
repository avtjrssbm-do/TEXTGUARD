<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TextGuard</title>

<link rel="manifest" href="manifest.json">

<style>

body{
margin:0;
padding:0;
font-family:Arial;
background:linear-gradient(
135deg,
#0B3D91,
#1E90FF
);
color:white;
}

.container{
max-width:700px;
margin:auto;
padding:20px;
}

h1{
text-align:center;
}

.card{
background:white;
color:black;
padding:15px;
margin-top:20px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,.2);
}

button,input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
}

button{
background:#00C853;
color:white;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#00A844;
}

.error{

border-left:4px solid red;

padding:10px;

margin-top:10px;

background:#fff0f0;

cursor:pointer;

border-radius:10px;

}

.error:hover{

background:#ffdcdc;

}

.progress-container{

display:none;

width:100%;

height:20px;

background:#ddd;

border-radius:30px;

margin-top:15px;

overflow:hidden;

}

.progress-bar{

width:0%;

height:100%;

background:#00C853;

transition:0.4s;

}

.preview{

background:#f5f5f5;

padding:10px;

margin-top:10px;

border-radius:10px;

max-height:250px;

overflow:auto;

}

.textContainer{

line-height:1.8;

white-space:pre-wrap;

font-size:16px;

height:350px;

overflow-y:auto;

padding:15px;

border:1px solid #ddd;

border-radius:10px;

background:white;

scroll-behavior:smooth;

}

.highlight{

background:#ffeb3b;

padding:2px;

border-radius:4px;

font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h1>📘 TextGuard</h1>

<div class="card">

<h3>Выберите файл</h3>

<input
type="file"
id="file"
onchange="showPreview()">

<button onclick="checkFile()">

Проверить

</button>

<div
class="progress-container"
id="progressContainer">

<div
class="progress-bar"
id="progressBar">

</div>

</div>

<div
class="preview"
id="preview">

Предпросмотр файла появится здесь

</div>

</div>

<div id="result"></div>

</div>

<script>

function showPreview(){

const file=
document.getElementById(
"file"
).files[0];

if(!file)return;

document.getElementById(
"preview"
).innerHTML=
`
Имя файла:
<b>${file.name}</b>

<br><br>

Размер:
${(file.size/1024).toFixed(2)} KB
`;

}


async function checkFile(){

const file=
document.getElementById(
"file"
).files[0];

if(!file){

alert(
"Выберите файл"
);

return;
}

const progress=
document.getElementById(
"progressContainer"
);

const bar=
document.getElementById(
"progressBar"
);

progress.style.display=
"block";

bar.style.width="10%";

const fakeProgress=
setInterval(()=>{

let current=
parseInt(
bar.style.width
);

if(current<90){

bar.style.width=
(current+10)+"%";

}

},400);

const formData=
new FormData();

formData.append(
"file",
file
);

try{

const response=
await fetch(
"https://textguard-ychm.onrender.com/check",
{
method:"POST",
body:formData
}
);

bar.style.width="100%";

clearInterval(
fakeProgress
);

const data=
await response.json();

let text=
data.text;

data.errors.forEach(
(error,index)=>{

const id=
"err"+index;

const escaped=
error.word.replace(
/[-\/\\^$*+?.()|[\]{}]/g,
'\\$&'
);

const regex=
new RegExp(
escaped,
"i"
);

text=
text.replace(
regex,

`<span
id="${id}"
class="highlight">

${error.word}

</span>`

);

});

let html=

`

<div class="card">

<h3>

${data.filename}

</h3>

<p>

📊 Плагиат:
<b>

${data.plagiarism}%

</b>

</p>

<p>

✅ Уникальность:
<b>

${data.uniqueness}%

</b>

</p>

<p>

❗ Ошибок:
${data.errors_count}

</p>

<p>

⏱ ${data.time} сек

</p>

</div>


<div class="card">

<h3>

Текст документа

</h3>

<div
class="textContainer"
id="textArea">

${text}

</div>

</div>

`;

if(data.errors.length>0){

html+=`

<div class="card">

<h3>

Ошибки

</h3>

`;

data.errors.forEach(
(e,index)=>{

html+=`

<div
class="error"

onclick="jumpToError(${index})"

>

<b>

${e.word}

</b>

<br>

${e.message}

<br><br>

Варианты:

${e.replacements.join(", ")}

</div>

`;

});

html+=`</div>`;

}

document.getElementById(
"result"
).innerHTML=
html;

setTimeout(()=>{

progress.style.display=
"none";

bar.style.width=
"0%";

},1000);

}

catch{

clearInterval(
fakeProgress
);

alert(
"Ошибка подключения"
);

progress.style.display=
"none";

}

}


function jumpToError(index){

const element=

document.getElementById(
"err"+index
);

const container=

document.getElementById(
"textArea"
);

container.scrollTop=
element.offsetTop-150;

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TextGuard</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:linear-gradient(135deg,#0B3D91,#1E90FF);
color:white;
}

.container{
max-width:700px;
margin:auto;
}

.card{
background:white;
color:black;
padding:15px;
margin-top:20px;
border-radius:15px;
}

button,input{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
}

button{
background:#00C853;
color:white;
font-size:16px;
}

.progress{
display:none;
height:20px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin-top:10px;
}

.bar{
height:100%;
width:0%;
background:#00C853;
transition:.3s;
}

.textBox{
height:350px;
overflow-y:auto;
border:1px solid #ddd;
padding:15px;
border-radius:10px;
background:#f7f7f7;
white-space:pre-wrap;
line-height:1.7;
scroll-behavior:smooth;
}

.highlight{
background:#ffeb3b;
padding:2px;
border-radius:4px;
}

.error{
margin-top:10px;
padding:10px;
background:#fff0f0;
border-left:4px solid red;
cursor:pointer;
border-radius:10px;
}

.error:hover{
background:#ffd9d9;
}

</style>
</head>

<body>

<div class="container">

<h1>📘 TextGuard</h1>

<div class="card">

<input type="file" id="file">

<button onclick="checkFile()">
Проверить
</button>

<div class="progress" id="progress">
<div class="bar" id="bar"></div>
</div>

</div>

<div id="result"></div>

</div>

<script>

async function checkFile(){

const file=document.getElementById("file").files[0];

if(!file){

alert("Выберите файл");
return;

}

const progress=
document.getElementById("progress");

const bar=
document.getElementById("bar");

progress.style.display="block";

let value=0;

let fake=
setInterval(()=>{

if(value<90){

value+=10;
bar.style.width=value+"%";

}

},300);

const formData=
new FormData();

formData.append(
"file",
file
);

try{

const response=
await fetch(
"https://textguard-ychm.onrender.com/check",
{
method:"POST",
body:formData
}
);

const data=
await response.json();

clearInterval(fake);

bar.style.width="100%";

let text=
data.text;

data.errors.forEach((e,i)=>{

let safeWord=
e.word.replace(
/[.*+?^${}()|[\]\\]/g,
'\\$&'
);

text=
text.replace(
new RegExp(
safeWord,
"i"
),

`<span
class="highlight"
id="err${i}"
>
${e.word}
</span>`

);

});

let html=`

<div class="card">

<h3>${data.filename}</h3>

<p>
📊 Плагиат:
<b>${data.plagiarism}%</b>
</p>

<p>
❗ Ошибок:
${data.errors_count}
</p>

<p>
⏱ ${data.time} сек
</p>

</div>

<div class="card">

<h3>
Текст документа
</h3>

<div
class="textBox"
id="textBox"
>

${text}

</div>

</div>

`;

if(data.errors.length){

html+=`
<div class="card">
<h3>Ошибки</h3>
`;

data.errors.forEach((e,i)=>{

html+=`

<div
class="error"
onclick="jumpToError(${i})"
>

<b>${e.word}</b>

<br>

${e.message}

<br><br>

${e.replacements.join(", ")}

</div>

`;

});

html+="</div>";

}

document.getElementById(
"result"
).innerHTML=html;

setTimeout(()=>{

progress.style.display="none";
bar.style.width="0%";

},1000);

}
catch{

alert(
"Ошибка подключения"
);

}

}

function jumpToError(index){

const target=
document.getElementById(
"err"+index
);

const box=
document.getElementById(
"textBox"
);

if(!target||!box)return;

box.scrollTop=
target.offsetTop-
150;

target.style.background=
"#ff9800";

setTimeout(()=>{

target.style.background=
"#ffeb3b";

},1000);

}

</script>

</body>
</html>

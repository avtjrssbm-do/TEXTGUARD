<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>TextGuard</title>

<style>

body{
background:#f2f5fb;
font-family:Arial;
padding:20px;
}

.container{
max-width:600px;
margin:auto;
}

.card{
background:white;
padding:20px;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

button{
width:100%;
padding:15px;
border:none;
border-radius:12px;
margin-top:10px;
font-size:16px;
font-weight:bold;
cursor:pointer;
color:white;
}

.chooseBtn{
background:#2962ff;
}

.addBtn{
background:#ff9800;
}

.checkBtn{
background:#00c853;
}

.error{
background:#fff3f3;
padding:15px;
border-radius:10px;
margin-top:10px;
border-left:5px solid red;
}

.highlight{
background:yellow;
}

.textBox{
max-height:300px;
overflow:auto;
line-height:1.7;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
background:#fafafa;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>TextGuard</h1>

<br>

<input
type="file"
id="file"
hidden
onchange="showFileName()"
>

<button
class="chooseBtn"
onclick="document.getElementById('file').click()"
>
Выбрать файл
</button>

<button
class="addBtn"
onclick="addToDatabase()"
>
Добавить в базу
</button>

<button
class="checkBtn"
onclick="checkFile()"
>
Проверить текст
</button>

<br><br>

<div id="selectedFile">
Файл не выбран
</div>

</div>

<div id="result"></div>

</div>

<script>

const API =
"https://textguard-ychm.onrender.com";


function showFileName(){

const file =
document.getElementById(
"file"
).files[0];

document.getElementById(
"selectedFile"
).innerHTML = file
? file.name
: "Файл не выбран";

}


async function addToDatabase(){

const file =
document.getElementById(
"file"
).files[0];

if(!file){

alert("Выберите файл");

return;

}

const formData =
new FormData();

formData.append(
"file",
file
);

try{

const response =
await fetch(
API + "/add_to_database",
{
method:"POST",
body:formData
}
);

const data =
await response.json();

alert(
"Файл добавлен:\n" +
data.filename
);

}
catch{

alert(
"Ошибка добавления"
);

}

}


async function checkFile(){

const file =
document.getElementById(
"file"
).files[0];

if(!file){

alert(
"Выберите файл"
);

return;

}

const formData =
new FormData();

formData.append(
"file",
file
);

try{

const response =
await fetch(
API + "/check",
{
method:"POST",
body:formData
}
);

const data =
await response.json();

let text =
data.text;

data.errors.forEach((e,i)=>{

let safe =
e.word.replace(
/[.*+?^${}()|[\]\\]/g,
'\\$&'
);

text =
text.replace(

new RegExp(
safe,
"i"
),

`<span class="highlight" id="err${i}">
${e.word}
</span>`

);

});

let html = `

<div class="card">

<h2>Результат</h2>

<br>

<p>
<b>Уникальность:</b>
${data.uniqueness}%
</p>

<br>

<p>
<b>Плагиат:</b>
${data.plagiarism}%
</p>

<br>

<p>
<b>Источник:</b>
${data.source}
</p>

<br>

<p>
<b>Ошибок:</b>
${data.errors_count}
</p>

<br>

<div class="textBox">
${text}
</div>

</div>

`;

if(data.errors.length){

html += `
<div class="card">

<h2>Ошибки</h2>
`;

data.errors.forEach((e,i)=>{

html += `

<div
class="error"
onclick="jumpToError(${i})"
>

<b>${e.word}</b>

<br><br>

${e.message}

<br><br>

${e.replacements.join(", ")}

</div>

`;

});

html += `</div>`;

}

document.getElementById(
"result"
).innerHTML =
html;

}
catch{

alert(
"Ошибка подключения"
);

}

}


function jumpToError(index){

const element =
document.getElementById(
"err"+index
);

if(!element)
return;

element.scrollIntoView({

behavior:"smooth",
block:"center"

});

}

</script>

</body>

</html>
